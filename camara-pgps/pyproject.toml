[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camara-pgps"
version = "0.1.0"
description = "Precondition-Guided Plan Synthesis: agentic RAG for CAMARA network-API orchestration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ahmed Anis", email = "theahmdanis3@gmail.com" }]
keywords = ["camara", "llm", "agents", "langgraph", "rag", "mcp"]

dependencies = [
    # Data modelling & configuration
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    # LLM orchestration
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langgraph>=0.2,<0.4",
    # HTTP / API surface
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    # Retrieval augmented generation
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # Knowledge graph
    "networkx>=3.3",
    # Plan / payload validation
    "jsonschema>=4.20",
    # Model Context Protocol
    "mcp>=1.0",
    "langchain-mcp-adapters>=0.1",
]

[project.optional-dependencies]
# LLM provider integrations for the agents. Optional: without them the agents
# fall back to deterministic rule-based parsing.
llm = [
    "langchain-anthropic>=0.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
camara-pgps = "camara_pgps.cli:main"

[project.urls]
Homepage = "https://github.com/ahmedanis1/camara-pgps"

[tool.hatch.build.targets.wheel]
packages = ["src/camara_pgps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# Optional LLM provider packages (the "llm" extra); imported lazily with a
# graceful ImportError fallback.
module = ["langchain_anthropic.*", "langchain_openai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# networkx / jsonschema ship no (bundled) type stubs.
module = ["networkx.*", "jsonschema.*"]
ignore_missing_imports = true
